name: Deploy

on:
  push:
    branches:
      - rubyconf-in
      - gophercon-in

jobs:
  deploy-rubyconf:
    name: Deploy RubyConf CFP
    if: github.ref_name == 'rubyconf-in'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-rubyconf
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: /data/srv/deploy.sh rubyconf

  deploy-gophercon:
    name: Deploy GopherCon CFP
    if: github.ref_name == 'gophercon-in'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-gophercon
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: /data/srv/deploy.sh gophercon
